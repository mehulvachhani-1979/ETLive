<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live ET Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="header">

    <div>
        <div class="title">
            ET LIVE STOCK DASHBOARD
        </div>

        <div class="sub">
            Live Recommendation Feed
        </div>
    </div>

    <button onclick="loadData()" class="refresh-btn">
        Refresh
    </button>

</div>

<div class="loader" id="loader">
    Fetching latest recommendations...
</div>

<div class="grid" id="grid"></div>

<script>

function createCard(item){

    return `

    <div class="card">

        <div class="stock">
            ${item.stock}
        </div>

        <div class="signal ${item.signal.toLowerCase()}">
            ${item.signal}
        </div>

        <div class="row">
            <span>Entry</span>
            <span>${item.entry}</span>
        </div>

        <div class="row">
            <span>Target</span>
            <span class="target">${item.target}</span>
        </div>

        <div class="row">
            <span>Stoploss</span>
            <span class="sl">${item.stoploss}</span>
        </div>

        <div class="note">
            ${item.note}
        </div>

    </div>

    `;
}

async function loadData(){

    document.getElementById('loader').style.display='block';

    const response = await fetch('/api/recommendations');

    const data = await response.json();

    document.getElementById('grid').innerHTML =
        data.map(createCard).join('');

    document.getElementById('loader').style.display='none';
}

loadData();

</script>

</body>
</html>
